spring.application.name=document-rag

spring.datasource.url=jdbc:postgresql://localhost:5432/document_rag
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

# API de embeddings (OpenAI). Troque para outro provider só mudando este adapter.
rag.embedding.api-key=${OPENAI_API_KEY:}
rag.embedding.api-url=https://api.openai.com/v1/embeddings
rag.embedding.model=text-embedding-3-small

# API de geração (Anthropic)
rag.anthropic.api-key=${ANTHROPIC_API_KEY:}
rag.anthropic.api-url=https://api.anthropic.com/v1/messages
rag.anthropic.model=claude-sonnet-5
rag.anthropic.api-version=2023-06-01
rag.anthropic.max-tokens=1024
