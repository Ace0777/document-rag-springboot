spring.application.name=document-rag

spring.datasource.url=jdbc:postgresql://localhost:5432/document_rag
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8080

# Embeddings via Ollama local (sem API key). Requer: brew install ollama && ollama pull nomic-embed-text
rag.embedding.api-url=${OLLAMA_EMBEDDING_URL:http://localhost:11434/api/embed}
rag.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Geração da resposta via Ollama local (sem API key). Requer: ollama pull llama3.1:8b
rag.chat.api-url=${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}
rag.chat.model=${OLLAMA_CHAT_MODEL:llama3.1:8b}
