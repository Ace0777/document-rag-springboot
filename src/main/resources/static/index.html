<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document RAG</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --muted: #8b92a3;
    --accent: #6d8cff;
    --accent-2: #4f6fe0;
    --user-bubble: #2a3450;
    --assistant-bubble: #1e222b;
    --danger: #ff6b6b;
    --ok: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }

  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  .brand {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-size: 13px;
    color: var(--muted);
  }

  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(109, 140, 255, 0.06);
    color: var(--text);
  }

  .dropzone input { display: none; }

  .dropzone .icon { font-size: 22px; margin-bottom: 8px; display: block; }

  .doc-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .doc-list h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 4px 0;
    font-weight: 600;
  }

  .doc-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .doc-item .name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .doc-item .meta {
    font-size: 11px;
    color: var(--muted);
  }

  .doc-item.pending { opacity: .6; }
  .doc-item.error { border-color: var(--danger); }
  .doc-item .status-ok { color: var(--ok); }
  .doc-item .status-error { color: var(--danger); }

  .empty-hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 12px 4px;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }

  .bubble {
    max-width: 640px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }

  .msg-row.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.assistant .bubble.loading {
    color: var(--muted);
  }

  .msg-row.assistant .bubble.error {
    border-color: var(--danger);
    color: var(--danger);
  }

  .sources {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sources summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
  }

  .source-chunk {
    margin-top: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 360px;
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state h2 { font-size: 16px; color: var(--text); margin: 0 0 6px; }
  .empty-state p { font-size: 13px; margin: 0; line-height: 1.5; }

  .composer {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .composer textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 140px;
  }

  .composer textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .send-btn {
    background: var(--accent);
    border: none;
    color: white;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }

  .send-btn:hover:not(:disabled) { background: var(--accent-2); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  .dots::after {
    content: '';
    display: inline-block;
    animation: dots 1.4s infinite steps(4, end);
    width: 1em;
    overflow: hidden;
    vertical-align: bottom;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand"><span class="dot"></span> Document RAG</div>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="application/pdf" />
    <span class="icon">📄</span>
    Solte um PDF aqui<br>ou clique para escolher
  </label>

  <div class="doc-list">
    <h3>Documentos</h3>
    <div id="docList"></div>
    <div class="empty-hint" id="docEmptyHint">Nenhum documento enviado ainda.</div>
  </div>
</div>

<div class="main">
  <div class="chat-header">Pergunte algo sobre os documentos enviados</div>
  <div class="chat-log" id="chatLog">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <h2>Envie um PDF pra começar</h2>
      <p>Depois de enviar, faça perguntas sobre o conteúdo do documento aqui no chat.</p>
    </div>
  </div>
  <div class="composer">
    <textarea id="questionInput" rows="1" placeholder="Digite sua pergunta..."></textarea>
    <button class="send-btn" id="sendBtn">Enviar</button>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const docList = document.getElementById('docList');
const docEmptyHint = document.getElementById('docEmptyHint');
const chatLog = document.getElementById('chatLog');
const emptyState = document.getElementById('emptyState');
const questionInput = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');

let hasDocuments = false;

// ---- upload ----

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});

['dragover', 'dragenter'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

async function uploadFile(file) {
  docEmptyHint.style.display = 'none';
  const item = document.createElement('div');
  item.className = 'doc-item pending';
  item.innerHTML = `<span class="name">${escapeHtml(file.name)}</span><span class="meta">Enviando...</span>`;
  docList.prepend(item);

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/documents', { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const doc = await res.json();
    item.classList.remove('pending');
    item.innerHTML = `<span class="name">${escapeHtml(doc.filename)}</span><span class="meta status-ok">✓ Processado</span>`;
    hasDocuments = true;
  } catch (err) {
    item.classList.remove('pending');
    item.classList.add('error');
    item.innerHTML = `<span class="name">${escapeHtml(file.name)}</span><span class="meta status-error">Falha: ${escapeHtml(err.message)}</span>`;
  } finally {
    fileInput.value = '';
  }
}

// ---- chat ----

questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});
sendBtn.addEventListener('click', sendQuestion);

async function sendQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;

  emptyState.remove();
  questionInput.value = '';
  sendBtn.disabled = true;

  addBubble('user', question);
  const loadingBubble = addBubble('assistant', 'Pensando', { loading: true });

  try {
    const res = await fetch('/api/questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const answer = await res.json();
    loadingBubble.remove();
    addBubble('assistant', answer.text, { sources: answer.sources });
  } catch (err) {
    loadingBubble.remove();
    addBubble('assistant', `Erro ao consultar: ${err.message}`, { error: true });
  } finally {
    sendBtn.disabled = false;
    questionInput.focus();
  }
}

function addBubble(role, text, opts = {}) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (opts.loading) bubble.classList.add('loading');
  if (opts.error) bubble.classList.add('error');

  if (opts.loading) {
    bubble.innerHTML = `<span class="dots">${escapeHtml(text)}</span>`;
  } else {
    bubble.textContent = text;
  }

  if (opts.sources && opts.sources.length) {
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    summary.textContent = `${opts.sources.length} trecho(s) usado(s) como fonte`;
    details.appendChild(summary);
    opts.sources.forEach(chunk => {
      const div = document.createElement('div');
      div.className = 'source-chunk';
      div.textContent = chunk.content;
      details.appendChild(div);
    });
    bubble.appendChild(details);
  }

  row.appendChild(bubble);
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
